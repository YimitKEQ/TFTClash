<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" font-family="Inter,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1422"/><stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5BA3DB"/><stop offset="0.5" stop-color="#818CF8"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5a6884"/>
    </marker>
  </defs>
  <rect width="1000" height="200" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="4" rx="2" fill="url(#accent)"/>

  <!-- stages -->
  <g>
    <!-- 1 join -->
    <rect x="24" y="56" width="150" height="88" rx="13" fill="#121a2b" stroke="#1f2a3c"/>
    <circle cx="99" cy="86" r="15" fill="rgba(91,163,219,.18)"/>
    <text x="99" y="91" font-size="16" text-anchor="middle" fill="#5BA3DB">VC</text>
    <text x="99" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="#eaf0f8">/record start</text>
    <text x="99" y="134" font-size="10" text-anchor="middle" fill="#8a97ad">join your voice channel</text>

    <!-- 2 record -->
    <rect x="198" y="56" width="150" height="88" rx="13" fill="#121a2b" stroke="#1f2a3c"/>
    <circle cx="273" cy="86" r="15" fill="rgba(248,113,113,.18)"/>
    <circle cx="273" cy="86" r="5" fill="#F87171"/>
    <text x="273" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="#eaf0f8">Record</text>
    <text x="273" y="134" font-size="10" text-anchor="middle" fill="#8a97ad">per-speaker tracks</text>

    <!-- 3 whisper -->
    <rect x="372" y="56" width="150" height="88" rx="13" fill="#121a2b" stroke="#1f2a3c"/>
    <circle cx="447" cy="86" r="15" fill="rgba(129,140,248,.18)"/>
    <text x="447" y="91" font-size="13" text-anchor="middle" fill="#818CF8">aA</text>
    <text x="447" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="#eaf0f8">Transcribe</text>
    <text x="447" y="134" font-size="10" text-anchor="middle" fill="#8a97ad">local whisper (GPU)</text>

    <!-- 4 AI -->
    <rect x="546" y="56" width="150" height="88" rx="13" fill="#121a2b" stroke="#1f2a3c"/>
    <circle cx="621" cy="86" r="15" fill="rgba(232,160,32,.18)"/>
    <text x="621" y="91" font-size="15" text-anchor="middle" fill="#E8A020">*</text>
    <text x="621" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="#eaf0f8">Summarize</text>
    <text x="621" y="134" font-size="10" text-anchor="middle" fill="#8a97ad">Claude: recap + tasks</text>

    <!-- 5 approve -->
    <rect x="720" y="56" width="150" height="88" rx="13" fill="#121a2b" stroke="#1f2a3c"/>
    <circle cx="795" cy="86" r="15" fill="rgba(52,211,153,.18)"/>
    <path d="M789,86 l4,4 l8,-8" stroke="#34D399" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="795" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="#eaf0f8">You approve</text>
    <text x="795" y="134" font-size="10" text-anchor="middle" fill="#8a97ad">pick the real tasks</text>

    <!-- 6 outputs -->
    <rect x="894" y="44" width="92" height="50" rx="11" fill="#0f1623" stroke="#34D399" stroke-opacity=".5"/>
    <text x="940" y="66" font-size="11" font-weight="700" text-anchor="middle" fill="#34D399">Board</text>
    <text x="940" y="81" font-size="9" text-anchor="middle" fill="#8a97ad">cards + dashboard</text>
    <rect x="894" y="106" width="92" height="50" rx="11" fill="#0f1623" stroke="#5BA3DB" stroke-opacity=".5"/>
    <text x="940" y="128" font-size="11" font-weight="700" text-anchor="middle" fill="#5BA3DB">Jira</text>
    <text x="940" y="143" font-size="9" text-anchor="middle" fill="#8a97ad">issues in KAN</text>
  </g>

  <!-- arrows -->
  <g stroke="#5a6884" stroke-width="2" fill="none">
    <line x1="176" y1="100" x2="194" y2="100" marker-end="url(#arrow)"/>
    <line x1="350" y1="100" x2="368" y2="100" marker-end="url(#arrow)"/>
    <line x1="524" y1="100" x2="542" y2="100" marker-end="url(#arrow)"/>
    <line x1="698" y1="100" x2="716" y2="100" marker-end="url(#arrow)"/>
    <path d="M872,90 C884,90 884,69 892,69" marker-end="url(#arrow)"/>
    <path d="M872,110 C884,110 884,131 892,131" marker-end="url(#arrow)"/>
  </g>

  <text x="24" y="34" font-size="14" font-weight="800" fill="#eaf0f8">How /record turns a voice call into tasks</text>
  <text x="24" y="184" font-size="10" fill="#5a6884">/record stop runs Transcribe -> Summarize automatically. Full transcript is attached as a file. Audio stays local.</text>
</svg>
