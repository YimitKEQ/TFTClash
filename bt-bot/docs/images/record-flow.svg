<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" font-family="Inter,system-ui,sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f9bd8"/><stop offset="0.5" stop-color="#8b8fd6"/><stop offset="1" stop-color="#5fb58a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5a6884"/>
    </marker>
  </defs>
  <rect width="1000" height="250" rx="14" fill="#0e1422"/>
  <rect x="0" y="0" width="1000" height="3" rx="2" fill="url(#accent)"/>

  <text x="24" y="32" font-size="14" font-weight="800" fill="#e6e8ec">How /record turns a voice call into a recap and tasks</text>

  <!-- stages -->
  <g>
    <rect x="24" y="56" width="146" height="84" rx="12" fill="#121a2b" stroke="#1f2a3c"/>
    <text x="97" y="92" font-size="13" text-anchor="middle" fill="#6f9bd8" font-weight="700">/record start</text>
    <text x="97" y="112" font-size="12" font-weight="700" text-anchor="middle" fill="#e6e8ec">Join VC</text>
    <text x="97" y="128" font-size="10" text-anchor="middle" fill="#9197a1">talk normally</text>

    <rect x="190" y="56" width="146" height="84" rx="12" fill="#121a2b" stroke="#1f2a3c"/>
    <circle cx="263" cy="88" r="11" fill="rgba(217,101,107,.2)"/><circle cx="263" cy="88" r="4" fill="#d9656b"/>
    <text x="263" y="112" font-size="12" font-weight="700" text-anchor="middle" fill="#e6e8ec">Record</text>
    <text x="263" y="128" font-size="10" text-anchor="middle" fill="#9197a1">per-speaker tracks</text>

    <rect x="356" y="56" width="146" height="84" rx="12" fill="#121a2b" stroke="#1f2a3c"/>
    <text x="429" y="92" font-size="13" text-anchor="middle" fill="#8b8fd6" font-weight="700">aA</text>
    <text x="429" y="112" font-size="12" font-weight="700" text-anchor="middle" fill="#e6e8ec">Transcribe</text>
    <text x="429" y="128" font-size="10" text-anchor="middle" fill="#9197a1">local whisper (GPU)</text>

    <rect x="522" y="56" width="146" height="84" rx="12" fill="#121a2b" stroke="#1f2a3c"/>
    <text x="595" y="92" font-size="14" text-anchor="middle" fill="#c89a4a" font-weight="700">AI</text>
    <text x="595" y="112" font-size="12" font-weight="700" text-anchor="middle" fill="#e6e8ec">Recap + tasks</text>
    <text x="595" y="128" font-size="10" text-anchor="middle" fill="#9197a1">Claude summarizes</text>

    <rect x="688" y="56" width="146" height="84" rx="12" fill="#121a2b" stroke="#1f2a3c"/>
    <path d="M589,0" /><path d="M756,84 l4,4 l8,-8" stroke="#5fb58a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(5,3)"/>
    <circle cx="761" cy="88" r="11" fill="rgba(95,181,138,.18)"/>
    <path d="M756,88 l3,3 l6,-7" stroke="#5fb58a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="761" y="112" font-size="12" font-weight="700" text-anchor="middle" fill="#e6e8ec">You approve</text>
    <text x="761" y="128" font-size="10" text-anchor="middle" fill="#9197a1">pick the real tasks</text>
  </g>

  <!-- outputs -->
  <g>
    <rect x="860" y="40" width="116" height="40" rx="9" fill="#0e1422" stroke="#5fb58a" stroke-opacity=".5"/>
    <text x="918" y="58" font-size="11" font-weight="700" text-anchor="middle" fill="#5fb58a">Recap</text>
    <text x="918" y="72" font-size="8.5" text-anchor="middle" fill="#9197a1">#bt-meetings + dash</text>
    <rect x="860" y="88" width="116" height="40" rx="9" fill="#0e1422" stroke="#6f9bd8" stroke-opacity=".5"/>
    <text x="918" y="106" font-size="11" font-weight="700" text-anchor="middle" fill="#6f9bd8">Board cards</text>
    <text x="918" y="120" font-size="8.5" text-anchor="middle" fill="#9197a1">Ideas column</text>
    <rect x="860" y="136" width="116" height="40" rx="9" fill="#0e1422" stroke="#8b8fd6" stroke-opacity=".5"/>
    <text x="918" y="154" font-size="11" font-weight="700" text-anchor="middle" fill="#8b8fd6">Jira issues</text>
    <text x="918" y="168" font-size="8.5" text-anchor="middle" fill="#9197a1">KAN board</text>
  </g>

  <!-- arrows -->
  <g stroke="#5a6884" stroke-width="2" fill="none">
    <line x1="172" y1="98" x2="188" y2="98" marker-end="url(#arrow)"/>
    <line x1="338" y1="98" x2="354" y2="98" marker-end="url(#arrow)"/>
    <line x1="504" y1="98" x2="520" y2="98" marker-end="url(#arrow)"/>
    <line x1="670" y1="98" x2="686" y2="98" marker-end="url(#arrow)"/>
    <path d="M836,86 C850,86 848,60 858,60" marker-end="url(#arrow)"/>
    <path d="M836,98 C850,98 850,108 858,108" marker-end="url(#arrow)"/>
    <path d="M836,110 C850,110 848,156 858,156" marker-end="url(#arrow)"/>
  </g>

  <text x="24" y="226" font-size="11" fill="#5a6884">/record stop runs Transcribe and Recap automatically. Audio stays on the machine. The full transcript is attached as a file.</text>
</svg>
