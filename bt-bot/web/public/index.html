<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrosephTech HQ</title>
<style>
  :root{
    --bg:#0a0b0d; --panel:#101216; --line:#1f2228; --line-soft:#181a1f;
    --text:#e8eaee; --muted:#a0a6b0; --faint:#737984;
    --content:#6f9bd8; --engineering:#8b8fd6; --design:#cf7fab; --marketing:#c59a4f; --ops:#5fb58a;
    --red:#d9656b; --amber:#c89a4a; --green:#5fb58a; --blue:#6f9bd8; --violet:#8b8fd6;
    --accent:#6f9bd8;
  }
  *{box-sizing:border-box}
  ::selection{background:rgba(111,155,216,.25)}
  body{
    margin:0; color:var(--text); background:var(--bg); min-height:100vh;
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:14px;
  }
  .wrap{max-width:1320px;margin:0 auto;padding:26px 26px 80px}
  a{color:inherit;text-decoration:none}
  .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* header */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;border-radius:8px;background:#15171c;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text);font-size:14px;letter-spacing:.5px}
  h1{font-size:17px;margin:0;letter-spacing:-.2px;font-weight:650}
  .sub{color:var(--faint);font-size:12px;margin-top:2px}
  .meta{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .live{display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .btn{background:#15171c;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:12px;padding:5px 11px;border-radius:7px;cursor:pointer}
  .btn:hover{color:var(--text);border-color:#2b2f37}
  .btn[aria-busy="true"]{opacity:.6;pointer-events:none}
  a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
  .jira-item:focus-visible{outline-offset:-2px}
  /* Respect users who prefer no motion */
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  /* layout */
  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);margin:34px 2px 14px;font-weight:600}
  .grid{display:grid;gap:14px}
  .cols-2{grid-template-columns:1fr 1fr}
  .cols-3{grid-template-columns:repeat(3,1fr)}
  .split{grid-template-columns:1.05fr 1fr}
  @media(max-width:980px){.cols-2,.cols-3,.split{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  .panel h2,.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--faint);margin:0 0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:600}
  .pill{font-size:11px;color:var(--faint);font-weight:500}
  .link{font-size:11px;color:var(--accent);font-weight:500}

  /* KPIs - flat stat strip, neutral numbers */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
  .kpi{padding:16px 18px;position:relative;border-right:1px solid var(--line-soft)}
  .kpi:last-child{border-right:0}
  .kpi .ico{position:absolute;right:14px;top:15px;color:var(--faint);opacity:.5}
  .kpi .n{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-1px;color:var(--text)}
  .kpi.alert .n{color:var(--red)}
  .kpi .l{color:var(--muted);font-size:11px;letter-spacing:.2px;margin-top:9px}

  /* donut */
  .donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .donut{position:relative;width:148px;height:148px;flex:none}
  .donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .donut .center b{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .donut .center span{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
  .legend{flex:1;min-width:160px;display:flex;flex-direction:column;gap:10px}
  .leg{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .leg .sw{width:8px;height:8px;border-radius:2px;flex:none}
  .leg .nm{flex:1}
  .leg .vv{font-variant-numeric:tabular-nums;color:var(--text);font-weight:500}

  /* pipeline */
  .pipe{display:flex;align-items:stretch;gap:6px}
  .stage{flex:1;background:#15171c;border:1px solid var(--line-soft);border-radius:8px;padding:13px;text-align:center}
  .stage .c{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .stage .nm{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);margin-top:6px}
  .stage.done .c{color:var(--green)}
  .stage .bar{height:2px;border-radius:2px;margin-top:10px;background:var(--accent);opacity:.55}
  .stage.done .bar{background:var(--green)}

  /* crew */
  .crew{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .crew-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px}
  .crew-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .ava{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;color:var(--muted);background:#191c22;border:1px solid var(--line);flex:none;letter-spacing:.3px}
  .crew-name{font-weight:600;font-size:14px;line-height:1.1}
  .crew-role{font-size:11px;color:var(--faint);margin-top:2px}
  .crew-act{margin-left:auto;text-align:right}
  .crew-act b{font-size:17px;font-variant-numeric:tabular-nums;font-weight:600}
  .crew-act span{display:block;font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin-top:1px}
  .loadbar{height:5px;border-radius:3px;background:#191c22;overflow:hidden;display:flex}
  .loadbar i{height:100%}
  .crew-stats{display:flex;gap:14px;margin-top:11px;font-size:11px;color:var(--muted)}
  .crew-stats b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
  .clear{color:var(--faint);font-size:12px}

  /* item lists */
  .item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
  .item:last-child{border-bottom:0}
  .pdot{width:6px;height:6px;border-radius:50%;margin-top:6px;flex:none}
  .tag{font-size:10px;font-weight:500;letter-spacing:.2px;padding:1px 8px;border-radius:5px;white-space:nowrap;border:1px solid;background:transparent}
  .item .t{flex:1;min-width:0}
  .item .t .ttl{font-size:13px;line-height:1.3}
  .item .t .sub{font-size:11px;color:var(--faint);margin-top:2px}
  .badge{font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
  .empty{color:var(--faint);font-size:12px;padding:18px 0;text-align:center}

  /* jira */
  .segbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#191c22;margin-bottom:14px}
  .segbar i{height:100%}
  .seglabels{display:flex;gap:18px;font-size:12px;margin-bottom:16px;flex-wrap:wrap;color:var(--muted)}
  .seglabels span{display:flex;align-items:center;gap:6px}
  .seglabels b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
  .jira-item{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .jira-item:last-child{border-bottom:0}
  .jkey{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap}
  .jira-item .js{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spill{font-size:10px;padding:1px 8px;border-radius:5px;white-space:nowrap;font-weight:500;border:1px solid var(--line);color:var(--muted)}
  .st-new{color:#8ea3c2} .st-ind{color:#cbab63} .st-done{color:#6fb595}
  .jtype{width:3px;align-self:stretch;border-radius:2px;flex:none;min-height:18px}
  .jprio{font-size:9px;text-transform:uppercase;letter-spacing:.4px;padding:1px 6px;border-radius:4px;border:1px solid;white-space:nowrap;font-weight:600}
  .jp-high{color:#d9656b;border-color:#d9656b55}.jp-medium{color:#c89a4a;border-color:#c89a4a44}.jp-low{color:var(--faint);border-color:#3a3f48}.jp-highest{color:#e0484f;border-color:#e0484f66}
  .java{width:22px;height:22px;border-radius:6px;background:#191c22;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--muted);flex:none;letter-spacing:.2px}
  .jempty{width:22px;flex:none}
  /* kanban board */
  .jsummary{display:flex;gap:18px;font-size:12px;color:var(--muted);margin-bottom:2px;flex-wrap:wrap}
  .jsummary span{display:flex;align-items:center;gap:6px}
  .jsummary b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  @media(max-width:820px){.kanban{grid-template-columns:1fr}}
  .kcol{background:#0c0e12;border:1px solid var(--line-soft);border-radius:10px;padding:11px}
  .kcol-h{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);margin-bottom:11px;font-weight:600}
  .kcol-h .kdot{width:7px;height:7px;border-radius:50%;flex:none}
  .kcol-h .kn{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
  .kcards{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow-y:auto}
  .kcard{display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 11px;border-left:3px solid var(--tc,#737984)}
  .kcard:hover{border-color:#2b2f37}
  .kcard .ktop{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .kcard .kk{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--faint);font-weight:600}
  .kcard .ksum{font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .kcard .kf{display:flex;align-items:center;gap:7px;margin-top:9px}
  .kcard .kf .java{width:20px;height:20px;font-size:8px}
  .kempty{color:var(--faint);font-size:12px;padding:14px 4px;text-align:center}
  /* do-next focus queue */
  .focus-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
  .focus-row:last-child{border-bottom:0}
  .fbadge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:5px;white-space:nowrap;min-width:64px;text-align:center}
  .fb-late{background:rgba(217,101,107,.16);color:#e08a8e}.fb-blocked{background:rgba(217,101,107,.16);color:#e08a8e}.fb-today{background:rgba(200,154,74,.16);color:#d8b86a}.fb-soon{background:rgba(111,155,216,.14);color:#9bb8df}
  .focus-row .ft{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .focus-row .fo{font-size:11px;color:var(--faint);white-space:nowrap}
  .focus-clear{color:var(--green);font-size:13px;padding:16px 0;text-align:center}
  /* meeting recap hero */
  .recap{padding:0;overflow:hidden}
  .recap .empty{padding:24px}
  .rhero{padding:18px 20px}
  .reyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--faint);font-weight:600}
  .rtldr{font-size:18px;line-height:1.45;margin:9px 0 12px;color:var(--text);font-weight:500;max-width:80ch}
  .rmeta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
  .rmeta .sep{color:#2b2f37}
  .ravas{display:flex;margin-left:auto}
  .ravas .java{margin-left:-6px;border:1px solid var(--panel)}
  .rgrid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
  @media(max-width:760px){.rgrid{grid-template-columns:1fr}}
  .rcol{padding:16px 20px}
  .rcol + .rcol{border-left:1px solid var(--line)}
  @media(max-width:760px){.rcol + .rcol{border-left:0;border-top:1px solid var(--line)}}
  .rcol h4,.rblock h4{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);font-weight:600}
  .rlist{list-style:none;margin:0;padding:0}
  .rlist li{position:relative;padding:5px 0 5px 16px;font-size:13px;line-height:1.4;color:#c7ccd4}
  .rlist li::before{content:"";position:absolute;left:0;top:10px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .rtask{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
  .rtask .rt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rtask .ro{font-size:11px;color:var(--faint);white-space:nowrap}
  .rblock{border-top:1px solid var(--line);padding:15px 20px}
  .rblock h4{color:var(--red)}
  .rblock .rlist li::before{background:var(--red)}
  /* past recaps accordion */
  .rcap{border-bottom:1px solid var(--line-soft)}
  .rcap:last-child{border-bottom:0}
  .rcap-h{display:flex;align-items:center;gap:10px;padding:11px 0;cursor:pointer;width:100%;background:none;border:0;color:inherit;text-align:left;font:inherit}
  .rcap-h:hover .rct{color:#fff}
  .rcap-h .rct{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rcap-h .rcm{font-size:11px;color:var(--faint);white-space:nowrap}
  .rcap-h .chev{color:var(--faint);transition:transform .15s;flex:none}
  .rcap.open .chev{transform:rotate(90deg)}
  .rcap-body{display:none;padding:2px 0 14px 2px}
  .rcap.open .rcap-body{display:block}

  /* feeds + metrics */
  .feed .row{padding:12px 0;border-bottom:1px solid var(--line-soft)}
  .feed .row:last-child{border-bottom:0}
  .feed .rt{font-size:13px;font-weight:600}
  .feed .rs{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
  .feed .rm{font-size:11px;color:var(--faint);margin-top:5px}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px}
  .metric .mn{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .metric .ml{font-size:11px;color:var(--muted);letter-spacing:.2px;margin-top:5px}
  .metric .md{font-size:11px;margin-top:5px;font-weight:500}
  .spark{width:100%;height:30px;display:block;margin-top:10px;overflow:visible}
  .up{color:var(--green)} .down{color:var(--red)}
  .err{background:rgba(217,101,107,.08);border:1px solid rgba(217,101,107,.35);color:#e6a3a7;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">BT</div>
      <div><h1>BrosephTech HQ</h1><div class="sub" id="sub">Command center</div></div>
    </div>
    <div class="meta">
      <span class="live"><span class="dot" aria-hidden="true"></span>LIVE</span>
      <span id="clock" aria-hidden="true">--:--:--</span>
      <span id="updated" aria-live="polite">updated -</span>
      <a class="btn" href="/docs/" target="_blank" rel="noopener" title="How to use the bot">Guide</a>
      <button id="refresh" class="btn" type="button" aria-label="Refresh now" title="Refresh now">Refresh</button>
    </div>
  </header>

  <div class="err" id="err" role="alert"></div>
  <main>
  <h2 class="section-title" id="kpi-h">Overview</h2>
  <div class="kpis" id="kpis" role="group" aria-labelledby="kpi-h"></div>

  <h2 class="section-title">Do next</h2>
  <div class="panel"><div id="focus"></div></div>

  <h2 class="section-title">Latest meeting</h2>
  <div class="panel recap" id="recap"></div>

  <h2 class="section-title">Workload</h2>
  <div class="grid split">
    <div class="panel"><h3>Active load by department</h3><div class="donut-wrap"><div class="donut" id="donut" role="img" aria-label="Active work by department"></div><div class="legend" id="legend"></div></div></div>
    <div class="panel"><h3>Board pipeline</h3><div class="pipe" id="pipe"></div></div>
  </div>

  <h2 class="section-title">Crew</h2>
  <div class="crew" id="crew"></div>

  <h2 class="section-title">Needs attention</h2>
  <div class="grid cols-2">
    <div class="panel"><h3>Overdue <span class="pill" id="overdue-c"></span></h3><div id="overdue"></div></div>
    <div class="panel"><h3>Due soon <span class="pill" id="duesoon-c"></span></h3><div id="duesoon"></div></div>
    <div class="panel"><h3>Stuck <span class="pill" id="stuck-c"></span></h3><div id="stuck"></div></div>
    <div class="panel"><h3>Blocked <span class="pill" id="blocked-c"></span></h3><div id="blocked"></div></div>
  </div>

  <h2 class="section-title">Jira</h2>
  <div class="panel" id="jira-panel"><h3>Jira board <span class="link" id="jira-link"></span></h3><div id="jira"></div></div>

  <h2 class="section-title">Meeting history</h2>
  <div class="grid cols-2">
    <div class="panel"><h3>Past recaps</h3><div id="recaps"></div></div>
    <div class="panel feed"><h3>Recently shipped</h3><div id="shipped"></div></div>
  </div>

  </main>
</div>

<script>
var DEPT_COLOR={content:'#6f9bd8',engineering:'#8b8fd6',design:'#cf7fab',marketing:'#c59a4f',ops:'#5fb58a'};
function deptColor(id){return DEPT_COLOR[id]||'#7a8aa0';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
// Decode HTML entities that arrive already-escaped from the API (e.g. "&amp;"),
// so we don't double-escape and show literal "&amp;".
var _decEl=document.createElement('textarea');
function dec(s){_decEl.innerHTML=String(s==null?'':s);return _decEl.value;}
function fmtNum(n){return n==null?'-':Number(n).toLocaleString();}
function getC(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function ago(iso){if(!iso)return '';var d=new Date(iso);if(isNaN(d))return '';var s=Math.floor((Date.now()-d.getTime())/1000);if(s<60)return s+'s ago';var m=Math.floor(s/60);if(m<60)return m+'m ago';var h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}
function dur(sec){if(!sec)return '0:00';var m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s;}
function initials(n){var p=String(n||'?').trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();}
var PRIO_COLOR={high:'#d9656b',medium:'#c89a4a',low:'#5f656f'};

var ICON={
  active:'M3 12h4l2 5 4-12 2 7h6',overdue:'M12 7v5l3 2M12 2a10 10 0 100 20 10 10 0 000-20',
  stuck:'M6 4h12M6 20h12M8 4c0 5 8 5 8 8s-8 3-8 8',due:'M7 3v3M17 3v3M3 9h18M5 5h14v15H5z',
  blocked:'M5 5l14 14M12 2a10 10 0 100 20 10 10 0 000-20',shipped:'M3 13l9-9 9 9M5 13v7h14v-7',ideas:'M9 21h6M10 17h4M12 2a7 7 0 00-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 00-4-12z'};
function svgIcon(name){var p=ICON[name]||'';return '<svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+p+'"/></svg>';}

function kpi(n,label,icon,alert){return '<div class="kpi'+(alert&&n>0?' alert':'')+'">'+svgIcon(icon)+'<div class="n">'+n+'</div><div class="l">'+label+'</div></div>';}

function donut(depts){
  var total=depts.reduce(function(s,d){return s+d.active;},0);
  var r=66,cx=80,cy=80,C=2*Math.PI*r,off=0;
  var segs=depts.filter(function(d){return d.active>0;}).map(function(d){
    var frac=total?d.active/total:0,len=frac*C,gap=Math.min(2.5,len*0.15);
    var s='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="12" stroke-dasharray="'+(len-gap).toFixed(2)+' '+(C-len+gap).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')" stroke-linecap="round"/>';
    off+=len;return s;
  }).join('');
  var svg='<svg width="148" height="148" viewBox="0 0 160 160"><circle cx="80" cy="80" r="66" fill="none" stroke="#191c22" stroke-width="12"/>'+segs+'</svg>';
  document.getElementById('donut').innerHTML=svg+'<div class="center"><b>'+total+'</b><span>active</span></div>';
  document.getElementById('legend').innerHTML=depts.map(function(d){
    return '<div class="leg"><span class="sw" style="background:'+d.color+'"></span><span class="nm">'+esc(d.label)+'</span><span class="vv">'+d.active+(d.overdue?'  <span style="color:var(--red)">'+d.overdue+' late</span>':'')+'</span></div>';
  }).join('');
}

function pipeline(cols){
  if(!cols||!cols.length){document.getElementById('pipe').innerHTML='<div class="empty">No cards yet</div>';return;}
  var max=Math.max.apply(null,cols.map(function(c){return c.count;}))||1;
  document.getElementById('pipe').innerHTML=cols.map(function(c){
    var w=Math.max(12,Math.round(c.count/max*100));
    return '<div class="stage'+(c.done?' done':'')+'"><div class="c">'+c.count+'</div><div class="nm">'+esc(c.label)+'</div><div class="bar" style="width:'+w+'%;margin-left:auto;margin-right:auto"></div></div>';
  }).join('<div style="align-self:center;color:var(--faint)">&rsaquo;</div>');
}

function crew(members){
  if(!members||!members.length){document.getElementById('crew').innerHTML='<div class="empty">No crew activity</div>';return;}
  document.getElementById('crew').innerHTML=members.map(function(m){
    var load=m.overdue+m.stuck+m.dueSoon+m.active||1;
    function seg(v,c){return v?'<i style="width:'+(v/load*100)+'%;background:'+c+'"></i>':'';}
    var bar=seg(m.overdue,getC('--red'))+seg(m.stuck,getC('--amber'))+seg(m.dueSoon,'#caa84a')+seg(m.active,getC('--blue'));
    return '<div class="crew-card"><div class="crew-top">'+
      '<div class="ava">'+esc(initials(m.name))+'</div>'+
      '<div><div class="crew-name">'+esc(m.name)+'</div><div class="crew-role">'+esc(m.role||'crew')+'</div></div>'+
      '<div class="crew-act"><b>'+m.active+'</b><span>active</span></div></div>'+
      '<div class="loadbar">'+bar+'</div>'+
      '<div class="crew-stats">'+
        (m.overdue?'<span style="color:var(--red)"><b>'+m.overdue+'</b> overdue</span>':'')+
        (m.stuck?'<span style="color:var(--amber)"><b>'+m.stuck+'</b> stuck</span>':'')+
        (m.dueSoon?'<span><b>'+m.dueSoon+'</b> soon</span>':'')+
        (!m.overdue&&!m.stuck&&!m.dueSoon?'<span class="clear">on track</span>':'')+
      '</div></div>';
  }).join('');
}

function listItems(items,kind){
  if(!items||!items.length)return '<div class="empty">All clear</div>';
  return items.map(function(it){
    var c=deptColor(it.department);
    var pc=PRIO_COLOR[it.priority]||'#5d6884';
    var tag=it.department?'<span class="tag" style="color:'+c+';border-color:'+c+'66">'+esc(it.department)+'</span>':'';
    var who=(it.assignees&&it.assignees.length)?it.assignees.join(', '):'Unassigned';
    var badge='';
    if(kind==='overdue')badge='<span class="badge" style="color:var(--red)">'+it.daysOverdue+'d late</span>';
    else if(kind==='duesoon')badge='<span class="badge" style="color:var(--amber)">'+(it.daysUntil===0?'today':'in '+it.daysUntil+'d')+'</span>';
    else if(kind==='stuck')badge='<span class="badge" style="color:var(--amber)">'+it.staleDays+'d idle</span>';
    else if(kind==='blocked')badge='<span class="badge" style="color:var(--red)">blocked</span>';
    else if(kind==='shipped')badge='<span class="badge" style="color:var(--green)">'+ago(it.shippedAt)+'</span>';
    var ttl=dec(it.title);
    return '<div class="item"><span class="pdot" style="background:'+pc+'" title="'+esc((it.priority||'')+' priority')+'"></span>'+tag+
      '<div class="t"><div class="ttl" title="'+esc(ttl)+'">'+esc(ttl)+'</div><div class="sub">'+esc(who)+'</div></div>'+badge+'</div>';
  }).join('');
}
function setList(id,items,kind){document.getElementById(id).innerHTML=listItems(items,kind);var c=document.getElementById(id+'-c');if(c)c.textContent=(items&&items.length)||0;}

var JTYPE_COLOR={Task:'#6f9bd8',Story:'#5fb58a',Bug:'#d9656b',Epic:'#8b8fd6',Subtask:'#737984'};
var JPRIO_W={highest:4,high:3,medium:2,low:1};
function jiraCard(it){
  var tcol=JTYPE_COLOR[it.type]||'#737984';
  var pl=String(it.priority||'').toLowerCase();
  var sum=dec(it.summary);
  var prio=it.priority?'<span class="jprio jp-'+(JPRIO_W[pl]?pl:'low')+'">'+esc(it.priority)+'</span>':'';
  var ava=it.assignee?'<span class="java" title="'+esc(it.assignee)+'">'+esc(initials(it.assignee))+'</span>':'';
  return '<a class="kcard" style="--tc:'+tcol+'" href="'+esc(it.url)+'" target="_blank" rel="noopener" aria-label="'+esc(it.key+': '+sum+' ('+(it.type||'issue')+', '+it.status+(it.priority?', '+it.priority:'')+(it.assignee?', '+it.assignee:'')+')')+'">'+
    '<div class="ktop"><span class="kk">'+esc(it.key)+'</span><span class="pill" style="margin-left:auto">'+esc(it.type||'')+'</span></div>'+
    '<div class="ksum" title="'+esc(sum)+'">'+esc(sum)+'</div>'+
    '<div class="kf">'+prio+ava+'</div></a>';
}
function jiraColumn(title,dot,items){
  var cards=items.length?items.map(jiraCard).join(''):'<div class="kempty">Nothing here</div>';
  return '<div class="kcol"><div class="kcol-h"><span class="kdot" style="background:'+dot+'"></span>'+title+'<span class="kn">'+items.length+'</span></div><div class="kcards">'+cards+'</div></div>';
}
function jiraPanel(j){
  var el=document.getElementById('jira'),link=document.getElementById('jira-link');
  if(!j||!j.configured){el.innerHTML='<div class="empty">Jira not connected - add JIRA_API_TOKEN to .env and restart, then /record jiracheck</div>';link.textContent='';return;}
  if(j.error){el.innerHTML='<div class="empty">Jira error: '+esc(j.error)+'</div>';return;}
  link.innerHTML='<a href="'+esc(j.browseUrl)+'" target="_blank" rel="noopener">open '+esc(j.projectKey)+' board &rsaquo;</a>';
  var c=j.counts;
  // Prefer the server-grouped board; fall back to grouping openItems/recent so
  // the kanban works even before the bot is restarted with the new code.
  var board=j.board;
  if(!board){var open=j.openItems||[],rec=j.recent||[];board={todo:open.filter(function(i){return i.category==='new';}),inProgress:open.filter(function(i){return i.category==='indeterminate';}),done:rec.filter(function(i){return i.category==='done';})};}
  function sw(col){return '<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+col+'"></span>';}
  var summary='<div class="jsummary"><span>'+sw('#6f9bd8')+'<b>'+c.todo+'</b> to do</span><span>'+sw('#c89a4a')+'<b>'+c.inProgress+'</b> in progress</span><span>'+sw('#5fb58a')+'<b>'+c.done+'</b> done</span><span style="margin-left:auto"><b>'+j.open+'</b> open of '+j.total+'</span></div>';
  var kb='<div class="kanban">'+
    jiraColumn('To do','#6f9bd8',board.todo||[])+
    jiraColumn('In progress','#c89a4a',board.inProgress||[])+
    jiraColumn('Done','#5fb58a',board.done||[])+'</div>';
  el.innerHTML=summary+kb;
}

// "Do next": one ranked queue of the most urgent board work to act on.
function focusQueue(d){
  var el=document.getElementById('focus'); if(!el) return;
  var rows=[];
  (d.lists.overdue||[]).forEach(function(c){rows.push({rank:0+(100-Math.min(99,c.daysOverdue||0)),badge:'fb-late',label:(c.daysOverdue||0)+'d late',it:c});});
  (d.lists.blocked||[]).forEach(function(c){rows.push({rank:200,badge:'fb-blocked',label:'blocked',it:c});});
  (d.lists.dueSoon||[]).forEach(function(c){var today=c.daysUntil===0;rows.push({rank:today?150:300+(c.daysUntil||0),badge:today?'fb-today':'fb-soon',label:today?'due today':'in '+c.daysUntil+'d',it:c});});
  rows.sort(function(a,b){return a.rank-b.rank;});
  if(!rows.length){el.innerHTML='<div class="focus-clear">All caught up. Nothing overdue, blocked, or due soon.</div>';return;}
  el.innerHTML=rows.slice(0,7).map(function(r){
    var it=r.it,who=(it.assignees&&it.assignees.length)?it.assignees.join(', '):'Unassigned',ttl=dec(it.title);
    var dc=deptColor(it.department);
    return '<div class="focus-row"><span class="fbadge '+r.badge+'">'+r.label+'</span>'+
      (it.department?'<span class="tag" style="color:'+dc+';border-color:'+dc+'66">'+esc(it.department)+'</span>':'')+
      '<span class="ft" title="'+esc(ttl)+'">'+esc(ttl)+'</span><span class="fo">'+esc(who)+'</span></div>';
  }).join('');
}

// ---- meeting recap ----
function durLong(sec){sec=Math.round(sec||0);if(sec<60)return sec+'s';var m=Math.round(sec/60);if(m<60)return m+'m';return Math.floor(m/60)+'h '+(m%60)+'m';}
function recapListHtml(items){if(!items||!items.length)return '';return '<ul class="rlist">'+items.map(function(s){return '<li>'+esc(dec(s))+'</li>';}).join('')+'</ul>';}
function recapTasksHtml(tasks){
  if(!tasks||!tasks.length)return '<div style="color:var(--faint);font-size:13px">No tasks created</div>';
  return tasks.slice(0,8).map(function(t){
    var pc=PRIO_COLOR[String(t.priority||'').toLowerCase()]||'#5f656f',dc=deptColor(t.department);
    var tag=t.department?'<span class="tag" style="color:'+dc+';border-color:'+dc+'66">'+esc(t.department)+'</span>':'';
    return '<div class="rtask"><span class="pdot" style="background:'+pc+'" title="'+esc(t.priority||'')+'"></span><span class="rt" title="'+esc(dec(t.title))+'">'+esc(dec(t.title))+'</span>'+tag+(t.assignee?'<span class="ro">'+esc(t.assignee)+'</span>':'')+'</div>';
  }).join('');
}
function avatarsHtml(names){if(!names||!names.length)return '';return '<span class="ravas">'+names.slice(0,6).map(function(n){return '<span class="java" title="'+esc(n)+'">'+esc(initials(n))+'</span>';}).join('')+'</span>';}
function recapBody(r){
  var meta=[];if(r.createdBy)meta.push(esc(r.createdBy));meta.push(ago(r.createdAt));
  if(r.durationSeconds)meta.push(durLong(r.durationSeconds));
  if(r.participants&&r.participants.length)meta.push(r.participants.length+' in call');
  meta.push((r.tasksCreated||0)+' task(s)');
  var html='<div class="rhero"><div class="reyebrow">'+esc(r.title||'Meeting')+'</div>'+
    '<div class="rtldr">'+esc(dec(r.tldr||'No summary yet.'))+'</div>'+
    '<div class="rmeta">'+meta.join(' <span class="sep">/</span> ')+avatarsHtml(r.participants)+'</div></div>';
  var hasD=r.decisions&&r.decisions.length,hasTk=r.tasks&&r.tasks.length;
  if(hasD||hasTk){
    html+='<div class="rgrid"><div class="rcol"><h4>Decisions</h4>'+(hasD?recapListHtml(r.decisions):'<div style="color:var(--faint);font-size:13px">None logged</div>')+'</div>'+
      '<div class="rcol"><h4>Tasks created</h4>'+recapTasksHtml(r.tasks)+'</div></div>';
  }
  if(r.blockers&&r.blockers.length)html+='<div class="rblock"><h4>Blockers</h4>'+recapListHtml(r.blockers)+'</div>';
  return html;
}
function renderRecap(r){
  var el=document.getElementById('recap');
  if(!r||!r.tldr){el.innerHTML='<div class="empty">No meetings yet. Run /record start in a voice channel.</div>';return;}
  el.innerHTML=recapBody(r);
}
var RECAP_CACHE={};
function renderRecapList(list){
  var el=document.getElementById('recaps');
  var rest=(list||[]).slice(1);
  if(!rest.length){el.innerHTML='<div class="empty">No earlier meetings</div>';return;}
  el.innerHTML=rest.map(function(m){
    var meta=[m.createdBy||'team',durLong(m.durationSeconds),(m.participantCount||0)+' in call',(m.tasksCreated||0)+' task(s)'].join(' / ');
    return '<div class="rcap" data-id="'+esc(m.id)+'"><button class="rcap-h" type="button" aria-expanded="false">'+
      '<span class="chev">&rsaquo;</span><span class="rct" title="'+esc(dec(m.tldr||m.title))+'">'+esc(dec(m.tldr||m.title))+'</span><span class="rcm">'+ago(m.createdAt)+'</span></button>'+
      '<div class="rcap-body"><div class="rmeta" style="font-size:11px">'+esc(meta)+'</div></div></div>';
  }).join('');
}
document.getElementById('recaps').addEventListener('click',function(e){
  var btn=e.target.closest('.rcap-h');if(!btn)return;
  var cap=btn.closest('.rcap'),id=cap.getAttribute('data-id');
  var open=cap.classList.toggle('open');btn.setAttribute('aria-expanded',open?'true':'false');
  if(!open||cap.getAttribute('data-loaded')==='1')return;
  var body=cap.querySelector('.rcap-body');
  if(RECAP_CACHE[id]){body.innerHTML=recapBody(RECAP_CACHE[id]);cap.setAttribute('data-loaded','1');return;}
  fetch('/api/recap/'+encodeURIComponent(id),{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;}).then(function(rc){
    if(rc){RECAP_CACHE[id]=rc;body.innerHTML=recapBody(rc);cap.setAttribute('data-loaded','1');}
  }).catch(function(){});
});

function sparkline(vals,color){
  if(!vals||vals.length<2)return '';
  var w=120,h=32,min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),rng=(max-min)||1;
  var pts=vals.map(function(v,i){var x=(i/(vals.length-1))*w;var y=h-((v-min)/rng)*(h-6)-3;return x.toFixed(1)+','+y.toFixed(1);});
  var last=vals[vals.length-1],lx=w,ly=h-((last-min)/rng)*(h-6)-3;
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="2.5" fill="'+color+'"/></svg>';
}

var firstLoad=true;
var REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateCounts(){if(REDUCE)return;document.querySelectorAll('.kpi .n, .donut .center b').forEach(function(el){var target=parseInt(el.textContent,10)||0;if(target<=0)return;var t0=performance.now();el.textContent='0';function step(now){var p=Math.min(1,(now-t0)/650);el.textContent=Math.round(target*(p*(2-p)));if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);});}

function render(d){
  document.getElementById('err').style.display='none';
  var t=d.totals;
  document.getElementById('kpis').innerHTML=
    kpi(t.active,'Active','active')+
    kpi(t.overdue,'Overdue','overdue',true)+
    kpi(t.stuck,'Stuck','stuck',true)+
    kpi(t.dueSoon,'Due soon','due')+
    kpi(t.blocked,'Blocked','blocked',true)+
    kpi(t.shippedThisWeek,'Shipped 7d','shipped')+
    kpi(t.ideasOpen,'Open ideas','ideas');

  focusQueue(d);
  donut(d.departments||[]);
  pipeline(d.columns||[]);
  crew(d.members||[]);

  setList('overdue',d.lists.overdue,'overdue');
  setList('duesoon',d.lists.dueSoon,'duesoon');
  setList('stuck',d.lists.stuck,'stuck');
  setList('blocked',d.lists.blocked,'blocked');
  setList('shipped',d.lists.shipped,'shipped');

  jiraPanel(d.jira);

  renderRecap(d.latestRecap);
  renderRecapList(d.recaps||[]);
  document.getElementById('shipped').innerHTML=listItems((d.lists.shipped||[]).slice(0,8),'shipped');

  document.getElementById('sub').textContent=t.cards+' cards tracked';
  document.getElementById('updated').textContent='updated '+ago(d.generatedAt);
  if(firstLoad){animateCounts();firstLoad=false;}
}

var refreshBtn=document.getElementById('refresh');
async function load(){
  if(new URLSearchParams(location.search).get('demo')==='1'){ render(demoData()); return; }
  if(refreshBtn) refreshBtn.setAttribute('aria-busy','true');
  try{var r=await fetch('/api/overview',{credentials:'same-origin'});if(r.status===401){location.href='/';return;}if(!r.ok)throw new Error('HTTP '+r.status);render(await r.json());}
  catch(e){var el=document.getElementById('err');el.style.display='block';el.textContent='Could not load data: '+(e.message||e);}
  finally{ if(refreshBtn) refreshBtn.removeAttribute('aria-busy'); }
}

// Poll every 20s, but pause while the tab is hidden (saves the bot work) and
// refresh immediately when it comes back. Manual Refresh button too.
var pollTimer=null;
function startPolling(){ stopPolling(); pollTimer=setInterval(load,20000); }
function stopPolling(){ if(pollTimer){clearInterval(pollTimer);pollTimer=null;} }
document.addEventListener('visibilitychange',function(){ if(document.hidden){stopPolling();} else {load();startPolling();} });
if(refreshBtn) refreshBtn.addEventListener('click',load);
load(); startPolling();
</script>
