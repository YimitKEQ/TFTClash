<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrosephTech HQ</title>
<style>
  :root{
    --bg:#070b12; --panel:#0f1623; --panel2:#131c2c; --line:#1f2a3c;
    --text:#e6edf3; --muted:#8b98ad; --faint:#5d6a80;
    --content:#5BA3DB; --engineering:#818CF8; --design:#F472B6; --marketing:#E8A020; --ops:#34D399;
    --red:#F87171; --amber:#E8A020; --green:#34D399; --blue:#5BA3DB;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:
      radial-gradient(1200px 600px at 80% -10%, rgba(91,163,219,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 20%, rgba(129,140,248,.08), transparent 55%),
      var(--bg);
    color:var(--text); font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .wrap{max-width:1380px; margin:0 auto; padding:22px 22px 60px}
  header{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:12px}
  .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--engineering));
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#04121f;font-size:18px;box-shadow:0 8px 24px rgba(91,163,219,.35)}
  h1{font-size:19px;margin:0;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .meta{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);display:inline-block;margin-right:6px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .kpi{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:var(--accent,var(--blue))}
  .kpi .n{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-1px}
  .kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.2px;margin-top:8px}

  .grid{display:grid;gap:16px}
  .cols-2{grid-template-columns:1fr 1fr}
  .cols-3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:980px){.cols-2,.cols-3{grid-template-columns:1fr}}

  .panel{background:rgba(15,22,35,.75);border:1px solid var(--line);border-radius:16px;padding:18px;backdrop-filter:blur(6px)}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;justify-content:space-between}
  .pill{font-size:11px;color:var(--faint);font-weight:600}

  .depts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .dept{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;border-left:4px solid var(--c)}
  .dept .top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .dept .cdot{width:9px;height:9px;border-radius:50%;background:var(--c)}
  .dept .name{font-weight:700;font-size:13px}
  .dept .big{margin-left:auto;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
  .dept .stats{display:flex;gap:14px;font-size:11px;color:var(--muted)}
  .dept .stats b{color:var(--text);font-variant-numeric:tabular-nums}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px 8px;border-bottom:1px solid rgba(31,42,60,.5)}
  tr:last-child td{border-bottom:0}
  .num{font-variant-numeric:tabular-nums;text-align:center;width:64px}
  .hot{color:var(--red);font-weight:700}
  .warn{color:var(--amber);font-weight:700}
  .ok{color:var(--faint)}
  .name-cell{font-weight:600}
  .role{color:var(--faint);font-size:11px;margin-left:6px;font-weight:400}

  .item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(31,42,60,.5)}
  .item:last-child{border-bottom:0}
  .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:999px;white-space:nowrap;color:#04121f}
  .item .t{flex:1;min-width:0}
  .item .t .ttl{font-size:13px;line-height:1.3}
  .item .t .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .badge{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .empty{color:var(--faint);font-size:12px;padding:14px 0;text-align:center}

  .feed .row{padding:11px 0;border-bottom:1px solid rgba(31,42,60,.5)}
  .feed .row:last-child{border-bottom:0}
  .feed .rt{font-size:13px;font-weight:600}
  .feed .rs{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
  .feed .rm{font-size:11px;color:var(--faint);margin-top:4px}

  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
  .metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}
  .metric .mn{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .metric .ml{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:5px}
  .metric .md{font-size:11px;margin-top:4px;font-weight:700}
  .spark{width:100%;height:30px;display:block;margin-top:8px;overflow:visible}
  .up{color:var(--green)} .down{color:var(--red)}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);margin:26px 4px 12px}
  .err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.4);color:#fecaca;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">BT</div>
      <div>
        <h1>BrosephTech HQ</h1>
        <div class="sub" id="sub">Command center</div>
      </div>
    </div>
    <div class="meta">
      <span><span class="dot"></span>live</span>
      <span id="clock">--:--:--</span>
      <span id="updated">updated -</span>
    </div>
  </header>

  <div class="err" id="err"></div>
  <div class="kpis" id="kpis"></div>

  <div class="section-title">Department health</div>
  <div class="panel"><div class="depts" id="depts"></div></div>

  <div class="section-title">Who needs a nudge</div>
  <div class="panel">
    <table>
      <thead><tr><th>Crew</th><th class="num">Active</th><th class="num">Overdue</th><th class="num">Stuck</th><th class="num">Due soon</th></tr></thead>
      <tbody id="crew"></tbody>
    </table>
  </div>

  <div class="section-title">Work that needs attention</div>
  <div class="grid cols-2">
    <div class="panel"><h2>Overdue <span class="pill" id="overdue-c"></span></h2><div id="overdue"></div></div>
    <div class="panel"><h2>Due soon <span class="pill" id="duesoon-c"></span></h2><div id="duesoon"></div></div>
    <div class="panel"><h2>Stuck <span class="pill" id="stuck-c"></span></h2><div id="stuck"></div></div>
    <div class="panel"><h2>Blocked <span class="pill" id="blocked-c"></span></h2><div id="blocked"></div></div>
  </div>

  <div class="section-title">Momentum</div>
  <div class="grid cols-3">
    <div class="panel feed"><h2>Recent meetings</h2><div id="meetings"></div></div>
    <div class="panel feed"><h2>Recent recordings</h2><div id="voice"></div></div>
    <div class="panel feed"><h2>Recently shipped</h2><div id="shipped"></div></div>
  </div>

  <div class="section-title">Channel metrics</div>
  <div class="panel"><div class="metrics" id="metrics"></div></div>
</div>

<script>
var DEPT_COLOR = { content:'#5BA3DB', engineering:'#818CF8', design:'#F472B6', marketing:'#E8A020', ops:'#34D399' };
function deptColor(id){ return DEPT_COLOR[id] || '#7a8aa0'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function fmtNum(n){ if(n==null) return '-'; return Number(n).toLocaleString(); }
function ago(iso){
  if(!iso) return '';
  var d=new Date(iso); if(isNaN(d)) return '';
  var s=Math.floor((Date.now()-d.getTime())/1000);
  if(s<60) return s+'s ago'; var m=Math.floor(s/60); if(m<60) return m+'m ago';
  var h=Math.floor(m/60); if(h<24) return h+'h ago'; var dd=Math.floor(h/24); return dd+'d ago';
}
function dur(sec){ if(!sec) return '0:00'; var m=Math.floor(sec/60), s=sec%60; return m+':'+(s<10?'0':'')+s; }

function kpi(n, label, accent){
  return '<div class="kpi" style="--accent:'+accent+'"><div class="n" style="color:'+accent+'">'+n+'</div><div class="l">'+label+'</div></div>';
}

function sparkline(vals, color){
  if(!vals || vals.length < 2) return '';
  var w=120,h=30, min=Math.min.apply(null,vals), max=Math.max.apply(null,vals), rng=(max-min)||1;
  var pts=vals.map(function(v,i){ var x=(i/(vals.length-1))*w; var y=h-((v-min)/rng)*(h-6)-3; return x.toFixed(1)+','+y.toFixed(1); });
  var last=vals[vals.length-1], lx=w, ly=h-((last-min)/rng)*(h-6)-3;
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'
    + '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    + '<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="2.5" fill="'+color+'"/></svg>';
}

var firstLoad=true;
function animateCounts(){
  var els=document.querySelectorAll('.kpi .n');
  els.forEach(function(el){
    var target=parseInt(el.textContent,10)||0;
    if(target<=0) return;
    var t0=performance.now(), dur=650;
    el.textContent='0';
    function step(now){ var p=Math.min(1,(now-t0)/dur); el.textContent=Math.round(target*(p*(2-p))); if(p<1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  });
}

function listItems(items, kind){
  if(!items || !items.length) return '<div class="empty">All clear</div>';
  return items.map(function(it){
    var c=deptColor(it.department);
    var tag = it.department ? '<span class="tag" style="background:'+c+'">'+esc(it.department)+'</span>' : '';
    var who = (it.assignees && it.assignees.length) ? it.assignees.join(', ') : 'Unassigned';
    var badge='';
    if(kind==='overdue') badge='<span class="badge hot">'+it.daysOverdue+'d late</span>';
    else if(kind==='duesoon') badge='<span class="badge warn">'+(it.daysUntil===0?'today':'in '+it.daysUntil+'d')+'</span>';
    else if(kind==='stuck') badge='<span class="badge warn">'+it.staleDays+'d idle</span>';
    else if(kind==='blocked') badge='<span class="badge hot">blocked</span>';
    else if(kind==='shipped') badge='<span class="badge" style="color:var(--green)">'+ago(it.shippedAt)+'</span>';
    return '<div class="item">'+tag+'<div class="t"><div class="ttl">'+esc(it.title)+'</div><div class="sub">'+esc(who)+'</div></div>'+badge+'</div>';
  }).join('');
}

function render(d){
  document.getElementById('err').style.display='none';
  var t=d.totals;
  document.getElementById('kpis').innerHTML =
    kpi(t.active,'Active',getC('--blue')) +
    kpi(t.overdue,'Overdue',getC('--red')) +
    kpi(t.stuck,'Stuck',getC('--amber')) +
    kpi(t.dueSoon,'Due soon',getC('--amber')) +
    kpi(t.blocked,'Blocked',getC('--red')) +
    kpi(t.shippedThisWeek,'Shipped 7d',getC('--green')) +
    kpi(t.ideasOpen,'Open ideas',getC('--engineering'));

  document.getElementById('depts').innerHTML = (d.departments||[]).map(function(dp){
    return '<div class="dept" style="--c:'+dp.color+'">'+
      '<div class="top"><span class="cdot"></span><span class="name">'+esc(dp.label)+'</span><span class="big">'+dp.active+'</span></div>'+
      '<div class="stats"><span>overdue <b>'+dp.overdue+'</b></span><span>stuck <b>'+dp.stuck+'</b></span><span>soon <b>'+dp.dueSoon+'</b></span></div>'+
    '</div>';
  }).join('') || '<div class="empty">No departments</div>';

  document.getElementById('crew').innerHTML = (d.members||[]).map(function(m){
    function cell(v,cls){ return '<td class="num '+(v>0?cls:'ok')+'">'+v+'</td>'; }
    return '<tr><td class="name-cell">'+esc(m.name)+'<span class="role">'+esc(m.role)+'</span></td>'+
      '<td class="num">'+m.active+'</td>'+cell(m.overdue,'hot')+cell(m.stuck,'warn')+cell(m.dueSoon,'warn')+'</tr>';
  }).join('') || '<tr><td colspan="5" class="empty">No crew activity</td></tr>';

  setList('overdue', d.lists.overdue, 'overdue');
  setList('duesoon', d.lists.dueSoon, 'duesoon');
  setList('stuck', d.lists.stuck, 'stuck');
  setList('blocked', d.lists.blocked, 'blocked');
  setList('shipped', d.lists.shipped, 'shipped');

  document.getElementById('meetings').innerHTML = (d.meetings||[]).map(function(m){
    return '<div class="row"><div class="rt">'+esc(m.title)+'</div>'+
      (m.summary?'<div class="rs">'+esc(m.summary.slice(0,180))+(m.summary.length>180?'...':'')+'</div>':'')+
      '<div class="rm">'+m.tasksCreated+' task(s) - '+ago(m.createdAt)+'</div></div>';
  }).join('') || '<div class="empty">No meetings yet</div>';

  document.getElementById('voice').innerHTML = (d.voice||[]).map(function(v){
    return '<div class="row"><div class="rt">'+esc(v.channelName||'Recording')+' <span class="role">'+esc(v.status)+'</span></div>'+
      (v.summary?'<div class="rs">'+esc(v.summary.slice(0,160))+(v.summary.length>160?'...':'')+'</div>':'')+
      '<div class="rm">'+dur(v.durationSeconds)+' - '+v.tasksCreated+' task(s) - '+ago(v.createdAt)+'</div></div>';
  }).join('') || '<div class="empty">No recordings yet</div>';

  // shipped feed reuses the shipped list area already; nothing more here.

  var mEl=document.getElementById('metrics');
  if(d.metrics){
    var mt=d.metrics; var ser=mt.series||{};
    function met(n,label,delta,vals,color){
      var dh = (delta==null)?'' : '<div class="md '+(delta>=0?'up':'down')+'">'+(delta>=0?'+':'')+fmtNum(delta)+'</div>';
      return '<div class="metric"><div class="mn">'+fmtNum(n)+'</div><div class="ml">'+label+'</div>'+dh+sparkline(vals,color)+'</div>';
    }
    mEl.innerHTML = met(mt.ytSubs,'YouTube subs',mt.deltas.ytSubs,ser.ytSubs,'#FF5C5C')+
      met(mt.tiktokFollowers,'TikTok',mt.deltas.tiktokFollowers,ser.tiktokFollowers,getC('--blue'))+
      met(mt.patreonSubs,'Patreon',mt.deltas.patreonSubs,ser.patreonSubs,getC('--amber'))+
      met(mt.avgViews,'Avg views',mt.deltas.avgViews,ser.avgViews,getC('--engineering'));
  } else {
    mEl.innerHTML='<div class="empty">No metrics snapshots yet - log with /metrics</div>';
  }

  document.getElementById('sub').textContent = t.cards+' cards tracked';
  document.getElementById('updated').textContent = 'updated '+ago(d.generatedAt);

  if(firstLoad){ animateCounts(); firstLoad=false; }
}

function setList(id, items, kind){
  document.getElementById(id).innerHTML = listItems(items, kind);
  var c=document.getElementById(id+'-c'); if(c) c.textContent=(items&&items.length)||0;
}
function getC(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function tick(){ var d=new Date(); document.getElementById('clock').textContent=d.toTimeString().slice(0,8); }
setInterval(tick,1000); tick();

async function load(){
  try{
    var r=await fetch('/api/overview',{credentials:'same-origin'});
    if(r.status===401){ location.href='/'; return; }
    if(!r.ok){ throw new Error('HTTP '+r.status); }
    render(await r.json());
  }catch(e){
    var el=document.getElementById('err'); el.style.display='block'; el.textContent='Could not load data: '+(e.message||e);
  }
}
load(); setInterval(load, 20000);
</script>
</body>
</html>
