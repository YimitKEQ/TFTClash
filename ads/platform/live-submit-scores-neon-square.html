<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../_base.css"><style>
.ad{width:1080px;height:1080px;background:#05040f}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 28%,rgba(255,0,170,.38) 0%,transparent 52%),
  radial-gradient(ellipse at 50% 82%,rgba(0,240,255,.28) 0%,transparent 55%),
  linear-gradient(160deg,#05040f 0%,#0f0618 55%,#1a0425 100%)}
.grid{position:absolute;inset:0;background-image:
  linear-gradient(rgba(0,240,255,.08) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,240,255,.08) 1px,transparent 1px);
  background-size:60px 60px;mask-image:radial-gradient(ellipse at 50% 48%,#000 35%,transparent 82%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 1px,transparent 1px,transparent 4px)}

.layer{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:66px 72px}

.kicker{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.36em;color:#00f0ff;text-transform:uppercase;
  padding:10px 22px;border:1px solid rgba(0,240,255,.5);background:rgba(0,240,255,.05);text-shadow:0 0 18px rgba(0,240,255,.7)}
.kicker b{color:#ff00aa;text-shadow:0 0 14px rgba(255,0,170,.8)}

.mid{display:flex;flex-direction:column;align-items:center;gap:0}

.eyebrow{display:inline-flex;align-items:center;gap:14px;font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:.4em;color:#fff;text-transform:uppercase;margin-bottom:22px;
  padding:11px 26px;border:1px solid rgba(255,0,170,.55);background:rgba(255,0,170,.08);text-shadow:0 0 16px rgba(255,0,170,.6)}
.dot{width:18px;height:18px;border-radius:50%;background:#ff2266;box-shadow:0 0 20px rgba(255,34,102,.95),0 0 40px rgba(255,34,102,.6)}

.h{font-family:'Orbitron',sans-serif;font-weight:900;font-size:122px;line-height:.82;letter-spacing:-.02em;color:#fff;text-transform:uppercase;
  text-shadow:0 0 40px rgba(0,240,255,.7),0 0 80px rgba(255,0,170,.5)}
.h span{color:transparent;-webkit-text-stroke:3px #ff00aa;text-shadow:0 0 30px rgba(255,0,170,.8)}

.sub{margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:25px;letter-spacing:.16em;color:rgba(255,255,255,.85);text-transform:uppercase}

.alert{margin-top:40px;width:100%;max-width:880px;border:2px solid rgba(240,196,109,.7);background:rgba(240,196,109,.07);
  box-shadow:0 0 40px rgba(240,196,109,.22),inset 0 0 50px rgba(255,0,170,.06);padding:34px 34px}
.alert .lab{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.3em;color:#f0c46d;text-transform:uppercase;margin-bottom:14px;text-shadow:0 0 16px rgba(240,196,109,.7)}
.alert .big{font-family:'Orbitron',sans-serif;font-weight:900;font-size:58px;line-height:.96;letter-spacing:-.01em;color:#fff;text-transform:uppercase;text-shadow:0 0 30px rgba(240,196,109,.5)}
.alert .big span{color:#f0c46d}

.pitch{margin-top:34px;font-family:'JetBrains Mono',monospace;font-size:23px;letter-spacing:.12em;color:rgba(255,255,255,.78);text-transform:uppercase;line-height:1.7;max-width:860px}
.pitch b{color:#00f0ff;text-shadow:0 0 14px rgba(0,240,255,.7)}

.bot{display:flex;flex-direction:column;align-items:center;gap:20px}
.cta{font-family:'JetBrains Mono',monospace;font-size:25px;letter-spacing:.3em;color:#00f0ff;text-transform:uppercase;text-shadow:0 0 18px rgba(0,240,255,.8)}
.cta b{color:#ff00aa;text-shadow:0 0 18px rgba(255,0,170,.8)}
.lock{display:flex;align-items:center;gap:18px}
.tftc img{height:52px;width:52px}
.tftc .tw .l1,.tftc .tw .l2{font-size:29px}
</style></head><body>
<div class="ad"><div class="bg"></div><div class="grid"></div><div class="scan"></div>
  <div class="layer">
    <div class="kicker">// TFT_CLASH <b>×</b> SEASON 1</div>

    <div class="mid">
      <div class="eyebrow"><span class="dot"></span> Live Now</div>
      <div class="h">Lobbies<br><span>Are Up</span></div>
      <div class="sub">Find your lobby in Discord and load in</div>

      <div class="alert">
        <div class="lab">⚠ Don't forget</div>
        <div class="big">Submit your scores<br><span>on the site</span></div>
      </div>

      <div class="pitch">After <b>every game</b>, log your placement at <b>tftclash.com</b>. No submission = no points.</div>
    </div>

    <div class="bot">
      <div class="cta">▸ <b>tftclash.com</b> · discord.gg/8nyHY66rBP</div>
      <div class="lock"><div class="tftc"><img src="../../public/icon.png"><div class="tw"><div class="l1">TFT</div><div class="l2">CLASH</div></div></div></div>
    </div>
  </div>
</div></body></html>
