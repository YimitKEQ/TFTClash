<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../_base.css"><style>
.ad{width:1920px;height:480px;background:#05040f}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse at 16% 40%,rgba(255,0,170,.40) 0%,transparent 50%),
  radial-gradient(ellipse at 82% 60%,rgba(0,240,255,.36) 0%,transparent 52%),
  radial-gradient(ellipse at 74% 45%,rgba(240,196,109,.18) 0%,transparent 48%),
  linear-gradient(120deg,#05040f 0%,#0f0618 60%,#1a0425 100%)}
.grid{position:absolute;inset:0;background-image:
  linear-gradient(rgba(0,240,255,.08) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,240,255,.08) 1px,transparent 1px);
  background-size:60px 60px;mask-image:radial-gradient(ellipse at 50% 50%,#000 45%,transparent 90%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 1px,transparent 1px,transparent 4px)}
.streak{position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(115deg,transparent 0,transparent 110px,rgba(0,240,255,.05) 110px,rgba(0,240,255,.05) 111px,transparent 111px,transparent 220px,rgba(255,0,170,.05) 220px,rgba(255,0,170,.05) 221px)}
.frame{position:absolute;inset:26px;border:1px solid rgba(0,240,255,.18);pointer-events:none}
.frame::before,.frame::after,.frame i,.frame em{position:absolute;width:18px;height:18px;border:2px solid #00f0ff;content:'';filter:drop-shadow(0 0 10px rgba(0,240,255,.7))}
.frame::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.frame::after{top:-2px;right:-2px;border-left:0;border-bottom:0}
.frame i{bottom:-2px;left:-2px;border-right:0;border-top:0}
.frame em{bottom:-2px;right:-2px;border-left:0;border-top:0}

.chair{position:absolute;right:40px;bottom:-40px;height:520px;z-index:5;
  filter:drop-shadow(-26px 0 64px rgba(255,0,170,.55)) drop-shadow(26px 0 64px rgba(0,240,255,.5)) drop-shadow(0 30px 50px rgba(0,0,0,.85))}
.firstbadge{position:absolute;right:430px;top:120px;z-index:7;text-align:right;transform:rotate(-3deg)}
.firstbadge .b1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:40px;color:#f0c46d;text-transform:uppercase;line-height:1;text-shadow:0 0 22px rgba(240,196,109,.9)}
.firstbadge .b2{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.24em;color:#fff;text-transform:uppercase;margin-top:5px;opacity:.85}

.c{position:absolute;inset:60px 60px 54px 76px;z-index:6;display:flex;flex-direction:column;justify-content:space-between;max-width:1180px}
.top{display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:13px}
.brand img{width:46px;height:46px;filter:drop-shadow(0 0 12px rgba(0,240,255,.55)) drop-shadow(0 0 22px rgba(255,0,170,.35))}
.brand .wm{font-family:'Russo One',sans-serif;font-style:italic;font-size:30px;letter-spacing:-.02em;text-transform:uppercase;display:flex;gap:8px}
.brand .wm .l1{color:#00f0ff;text-shadow:0 0 14px rgba(0,240,255,.85)}
.brand .wm .l2{color:#ff00aa;text-shadow:0 0 14px rgba(255,0,170,.85)}
.kicker{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.3em;color:#00f0ff;text-transform:uppercase;padding:8px 16px;border:1px solid rgba(0,240,255,.5);background:rgba(0,240,255,.06);text-shadow:0 0 14px rgba(0,240,255,.7)}
.kicker b{color:#ff00aa}

.headrow{display:flex;align-items:baseline;gap:24px}
.season{font-family:'Orbitron',sans-serif;font-weight:900;font-size:26px;letter-spacing:.4em;color:#f0c46d;text-transform:uppercase;text-shadow:0 0 20px rgba(240,196,109,.6)}
.h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:84px;line-height:.86;letter-spacing:-.03em;color:#fff;text-transform:uppercase;text-shadow:0 0 26px rgba(0,240,255,.7),0 0 60px rgba(255,0,170,.45)}
.h1 span{color:transparent;-webkit-text-stroke:3px #ff00aa;text-shadow:0 0 22px rgba(255,0,170,.8)}
.lede{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.28em;color:#f0c46d;text-transform:uppercase;text-shadow:0 0 12px rgba(240,196,109,.5)}
.lede span{color:#fff;opacity:.45;margin:0 8px}

.prizeline{display:flex;gap:10px}
.pchip{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:9px 16px;border:1px solid rgba(0,240,255,.32);background:rgba(0,240,255,.05);color:#fff;display:flex;align-items:center;gap:8px}
.pchip .m{font-family:'Orbitron',sans-serif;font-weight:900}
.pchip.gold{border-color:rgba(240,196,109,.55);background:rgba(240,196,109,.1)}
.pchip.gold .m{color:#f0c46d;text-shadow:0 0 12px rgba(240,196,109,.8)}
.pchip.silver .m{color:#dcdceb}.pchip.bronze .m{color:#e89858}
.pchip .q{font-family:'Orbitron',sans-serif;font-weight:900;color:#fff}

.bot{display:flex;align-items:center;gap:22px}
.urlbar{font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.24em;color:#00f0ff;text-transform:uppercase;text-shadow:0 0 14px rgba(0,240,255,.8);padding:11px 22px;border:1px solid rgba(0,240,255,.55);background:rgba(0,240,255,.08)}
.urlbar b{color:#ff00aa;text-shadow:0 0 14px rgba(255,0,170,.8);font-weight:700}
.urlbar em{font-style:normal;color:#fff;opacity:.5;margin:0 10px}
.tag{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.24em;color:rgba(255,255,255,.7);text-transform:uppercase}
.tag b{color:#00f0ff;font-weight:700}
.partner{position:absolute;left:78px;bottom:24px;z-index:8;display:flex;align-items:center;gap:9px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.5);text-transform:uppercase}
.partner img{height:20px;filter:invert(1) drop-shadow(0 0 8px rgba(0,240,255,.4))}
</style></head><body>
<div class="ad"><div class="bg"></div><div class="grid"></div><div class="streak"></div><div class="scan"></div>
  <div class="frame"><i></i><em></em></div>
  <img class="chair" src="../../Autofull/M6 Ultra 2.0.png" alt="">
  <div class="firstbadge"><div class="b1">1ST PRIZE</div><div class="b2">AutoFull M6 Ultra Chair</div></div>
  <div class="c">
    <div class="top">
      <div class="brand"><img src="../../public/tftclash-icon.svg" alt=""><div class="wm"><span class="l1">TFT</span><span class="l2">CLASH</span></div></div>
      <div class="kicker">◆ SAT <b>·</b> JUNE 13 <b>·</b> TIME TBA <b>·</b> EU/NA POLL ◆</div>
    </div>
    <div class="headrow"><span class="season">SEASON<br>ONE</span><div class="h1">THE CLASH <span>BEGINS</span></div></div>
    <div class="lede">FREE TO ENTER<span>//</span>A NEW CLASH EVERY WEEK<span>//</span>EU + NA</div>
    <div class="prizeline">
      <div class="pchip gold"><span class="m">1ST</span> AUTOFULL CHAIR</div>
      <div class="pchip silver"><span class="m">2ND</span> <span class="q">?</span></div>
      <div class="pchip bronze"><span class="m">3RD</span> <span class="q">?</span></div>
    </div>
    <div class="bot">
      <div class="urlbar">▸ TFTCLASH<b>.</b>COM/DISCORD</div>
      <div class="tag">TOP 8 PAID OUT <b>·</b> POOL GROWS WITH EVERY ENTRY</div>
    </div>
  </div>
  <div class="partner">POWERED BY <img src="../../Autofull/autofull-logo-official.png" alt="AutoFull"></div>
</div></body></html>
