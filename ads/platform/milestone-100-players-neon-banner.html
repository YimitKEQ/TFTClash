<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../_base.css"><style>
.ad{width:1200px;height:628px;background:#05040f;filter:brightness(.85) saturate(.9)}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse at 20% 28%,rgba(255,0,170,.40) 0%,transparent 55%),
  radial-gradient(ellipse at 80% 70%,rgba(0,240,255,.34) 0%,transparent 55%),
  radial-gradient(ellipse at 60% 50%,rgba(240,196,109,.18) 0%,transparent 60%),
  linear-gradient(135deg,#05040f 0%,#0f0618 60%,#1a0425 100%)}
.grid{position:absolute;inset:0;background-image:
  linear-gradient(rgba(0,240,255,.08) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,240,255,.08) 1px,transparent 1px);
  background-size:55px 55px;mask-image:radial-gradient(circle at 50% 50%,#000 40%,transparent 85%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 1px,transparent 1px,transparent 4px);pointer-events:none}
.streak{position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(115deg,transparent 0,transparent 90px,rgba(0,240,255,.05) 90px,rgba(0,240,255,.05) 91px,transparent 91px,transparent 180px,rgba(255,0,170,.05) 180px,rgba(255,0,170,.05) 181px)}
.frame{position:absolute;inset:34px;border:1px solid rgba(0,240,255,.20);pointer-events:none}
.frame::before,.frame::after,.frame i,.frame em{position:absolute;width:18px;height:18px;border:2px solid #00f0ff;content:'';filter:drop-shadow(0 0 10px rgba(0,240,255,.7))}
.frame::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.frame::after{top:-2px;right:-2px;border-left:0;border-bottom:0}
.frame i{bottom:-2px;left:-2px;border-right:0;border-top:0}
.frame em{bottom:-2px;right:-2px;border-left:0;border-top:0}

.chair{position:absolute;right:-30px;top:50%;transform:translateY(-50%);height:600px;z-index:4;filter:drop-shadow(0 0 40px rgba(255,0,170,.45)) drop-shadow(0 0 80px rgba(0,240,255,.35))}
.chair-glow{position:absolute;right:-80px;top:50%;transform:translateY(-50%);width:560px;height:560px;background:radial-gradient(circle,rgba(255,0,170,.22) 0%,transparent 60%);z-index:3;pointer-events:none}

.c{position:absolute;left:84px;top:74px;bottom:74px;width:680px;display:flex;flex-direction:column;justify-content:space-between;z-index:6}

.brand{display:flex;align-items:center;gap:14px}
.brand img{width:42px;height:42px;filter:drop-shadow(0 0 12px rgba(0,240,255,.55)) drop-shadow(0 0 22px rgba(255,0,170,.35))}
.brand .wm{font-family:'Russo One',sans-serif;font-style:italic;font-size:26px;line-height:1;letter-spacing:-.02em;text-transform:uppercase;display:flex;gap:6px}
.brand .wm .l1{color:#00f0ff;text-shadow:0 0 14px rgba(0,240,255,.85)}
.brand .wm .l2{color:#ff00aa;text-shadow:0 0 14px rgba(255,0,170,.85)}

.kicker{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.45em;color:#f0c46d;text-transform:uppercase;padding:8px 18px;border:1px solid rgba(240,196,109,.55);background:rgba(240,196,109,.08);text-shadow:0 0 14px rgba(240,196,109,.7);align-self:flex-start;margin-top:14px}

.head{display:flex;flex-direction:column;align-items:flex-start;gap:0;margin-top:8px}
.huge{font-family:'Orbitron',sans-serif;font-weight:900;font-size:188px;line-height:.82;letter-spacing:-.04em;color:#fff;text-transform:uppercase;
  text-shadow:0 0 30px rgba(0,240,255,.85),0 0 60px rgba(255,0,170,.55),0 0 100px rgba(240,196,109,.35)}
.huge .plus{color:#ff00aa;text-shadow:0 0 30px rgba(255,0,170,.9);margin-left:6px}
.sub{font-family:'Orbitron',sans-serif;font-weight:900;font-size:42px;line-height:1;letter-spacing:-.01em;text-transform:uppercase;color:transparent;-webkit-text-stroke:2px #00f0ff;text-shadow:0 0 18px rgba(0,240,255,.7);margin-top:8px}
.lede{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.38em;color:#fff;opacity:.78;text-transform:uppercase;margin-top:18px;max-width:580px;line-height:1.6}
.lede b{color:#f0c46d;font-weight:700;text-shadow:0 0 10px rgba(240,196,109,.6)}

.cta{display:flex;flex-direction:column;gap:10px}
.tease{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.36em;color:#ff00aa;text-transform:uppercase;text-shadow:0 0 12px rgba(255,0,170,.7)}
.tease em{font-style:normal;color:#fff;opacity:.55;margin:0 8px}
.urlbar{font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.32em;color:#00f0ff;text-transform:uppercase;text-shadow:0 0 14px rgba(0,240,255,.8);padding:14px 26px;border:1px solid rgba(0,240,255,.55);background:rgba(0,240,255,.08);align-self:flex-start}
.urlbar b{color:#ff00aa;text-shadow:0 0 14px rgba(255,0,170,.8);font-weight:700}
.urlbar i{font-style:normal;color:#fff;opacity:.55;margin:0 10px}
</style></head><body>
<div class="ad"><div class="bg"></div><div class="grid"></div><div class="streak"></div><div class="scan"></div>
  <div class="frame"><i></i><em></em></div>
  <div class="chair-glow"></div>
  <img class="chair" src="../../Autofull/M6 Ultra 2.0.png">
  <div class="c">
    <div class="brand">
      <img src="../../public/tftclash-icon.svg" alt="">
      <div class="wm"><span class="l1">TFT</span><span class="l2">CLASH</span></div>
    </div>
    <div class="kicker">◆ MILESTONE UNLOCKED ◆</div>
    <div class="head">
      <div class="huge">100<span class="plus">+</span></div>
      <div class="sub">PLAYERS REGISTERED</div>
      <div class="lede">THANK YOU FOR JOINING.<br>PRIZES INCOMING <b>·</b> GAMING CHAIRS, CASH, MEMBERSHIPS <b>·</b> AND MANY MORE.</div>
    </div>
    <div class="cta">
      <div class="tease">▸ NEXT UP <em>//</em> JOIN THE CLASH</div>
      <div class="urlbar">▸ TFTCLASH<b>.</b>COM</div>
    </div>
  </div>
</div></body></html>
